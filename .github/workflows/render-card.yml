name: Render LinkedIn card
on:
  push:
    paths:
      - "posts/**/card.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Render every card.json
        run: |
          for f in $(find posts -name card.json); do python tools/render_card.py "$f"; done
      - name: Commit rendered images
        run: |
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add posts/**/card.png || true
          git diff --cached --quiet || git commit -m "Render market card images"
          git push
